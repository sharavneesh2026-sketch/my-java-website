<script type="text/plain" class="program-src" data-num="1" data-title="Write a Java method to find the smallest number among three numbers.">import java.util.Scanner;

public class Main {
    public static int smallest(int a, int b, int c) {
        return Math.min(a, Math.min(b, c));
    }

    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        int a = sc.nextInt();
        int b = sc.nextInt();
        int c = sc.nextInt();

        System.out.println(smallest(a, b, c));
        sc.close();
    }
}</script>
<script type="text/plain" class="program-src" data-num="2" data-title="Write a Java method to compute the average of three numbers.">import java.util.Scanner;

public class Main {
    public static double average(double a, double b, double c) {
        return (a + b + c) / 3.0;
    }

    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        double a = sc.nextDouble();
        double b = sc.nextDouble();
        double c = sc.nextDouble();

        System.out.println(average(a, b, c));
        sc.close();
    }
}</script>
<script type="text/plain" class="program-src" data-num="3" data-title="Write a Java method to display the middle character of a string. Note: a) If the length of the string is odd there will be two middle characters. b) If the length of the string is even there will be one middle character." data-note="The note appears reversed. The code below follows the standard rule: odd-length strings have one middle character, and even-length strings have two.">import java.util.Scanner;

public class Main {
    public static String middle(String str) {
        int length = str.length();

        if (length == 0) {
            return "";
        }

        if (length % 2 == 0) {
            return str.substring(length / 2 - 1, length / 2 + 1);
        }

        return str.substring(length / 2, length / 2 + 1);
    }

    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        String str = sc.nextLine();

        System.out.println(middle(str));
        sc.close();
    }
}</script>
<script type="text/plain" class="program-src" data-num="4" data-title="Write a Java method to count all the words in a string.">import java.util.Scanner;

public class Main {
    public static int countWords(String str) {
        str = str.trim();

        if (str.isEmpty()) {
            return 0;
        }

        return str.split("\\s+").length;
    }

    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        String str = sc.nextLine();

        System.out.println(countWords(str));
        sc.close();
    }
}</script>
<script type="text/plain" class="program-src" data-num="5" data-title="Write a Java method to compute the future investment value at a given interest rate for a specified number of years.">import java.util.Scanner;

public class Main {
    public static double futureInvestmentValue(double investment, double rate, int years) {
        return investment * Math.pow(1 + rate / 100.0, years);
    }

    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        double investment = sc.nextDouble();
        double rate = sc.nextDouble();
        int years = sc.nextInt();

        System.out.printf("%.2f%n", futureInvestmentValue(investment, rate, years));
        sc.close();
    }
}</script>
<script type="text/plain" class="program-src" data-num="6" data-title="Write a Java method to print characters between two characters (i.e. A to P).">import java.util.Scanner;

public class Main {
    public static void printCharacters(char start, char end) {
        for (char ch = start; ch <= end; ch++) {
            System.out.print(ch + " ");
        }
        System.out.println();
    }

    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        char start = sc.next().charAt(0);
        char end = sc.next().charAt(0);

        printCharacters(start, end);
        sc.close();
    }
}</script>
<script type="text/plain" class="program-src" data-num="7" data-title="Write a Java method to check whether a string is a valid password.">import java.util.Scanner;

public class Main {
    public static boolean isValidPassword(String password) {
        if (password.length() < 8) {
            return false;
        }

        boolean hasLetter = false;
        boolean hasDigit = false;

        for (char ch : password.toCharArray()) {
            if (Character.isLetter(ch)) {
                hasLetter = true;
            } else if (Character.isDigit(ch)) {
                hasDigit = true;
            } else {
                return false;
            }
        }

        return hasLetter && hasDigit;
    }

    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        String password = sc.nextLine();

        System.out.println(isValidPassword(password));
        sc.close();
    }
}</script>
<script type="text/plain" class="program-src" data-num="8" data-title="Write a Java method to display the current date and time.">import java.time.LocalDateTime;
import java.time.format.DateTimeFormatter;

public class Main {
    public static void displayDateTime() {
        LocalDateTime now = LocalDateTime.now();

    }
}</script>
<script type="text/plain" class="program-src" data-num="9" data-title="Write a Java method to find all twin prime numbers less than 100.">public class Main {
    public static boolean isPrime(int n) {
        if (n < 2) {
            return false;
        }

        for (int i = 2; i <= n / i; i++) {
            if (n % i == 0) {
                return false;
            }
        }

        return true;
    }

    public static void findTwinPrimes() {
        for (int i = 2; i + 2 < 100; i++) {
            if (isPrime(i) && isPrime(i + 2)) {
                System.out.println(i + " " + (i + 2));
            }
        }
    }

    public static void main(String[] args) {
        findTwinPrimes();
    }
}</script>
<script type="text/plain" class="program-src" data-num="10" data-title="Write a Java method to count the number of digits in an integer with the value 2. The integer may be assumed to be non-negative.">import java.util.Scanner;

public class Main {
    public static int countTwos(int number) {
        int count = 0;

        while (number > 0) {
            if (number % 10 == 2) {
                count++;
            }
            number /= 10;
        }

        return count;
    }

    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        int number = sc.nextInt();

        System.out.println(countTwos(number));
        sc.close();
    }
}</script>
<script type="text/plain" class="program-src" data-num="11" data-title="Write a Java method that accepts three integers and checks whether they are consecutive or not. Returns true or false.">import java.util.Scanner;
import java.util.Arrays;

public class Main {
    public static boolean areConsecutive(int a, int b, int c) {
        int[] numbers = {a, b, c};
        Arrays.sort(numbers);

        return (long) numbers[1] == (long) numbers[0] + 1
            && (long) numbers[2] == (long) numbers[1] + 1;
    }

    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        int a = sc.nextInt();
        int b = sc.nextInt();
        int c = sc.nextInt();

        System.out.println(areConsecutive(a, b, c));
        sc.close();
    }
}</script>
<script type="text/plain" class="program-src" data-num="12" data-title="Write a Java method that accepts three integers and returns true if one is the middle point between the other two integers, otherwise false.">import java.util.Scanner;

public class Main {
    public static boolean isMiddlePoint(int a, int b, int c) {
        return (long) a + c == 2L * b
            || (long) a + b == 2L * c
            || (long) b + c == 2L * a;
    }

    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        int a = sc.nextInt();
        int b = sc.nextInt();
        int c = sc.nextInt();

        System.out.println(isMiddlePoint(a, b, c));
        sc.close();
    }
}</script>
<script type="text/plain" class="program-src" data-num="13" data-title="Write a Java method that checks whether all the characters in a given string are vowels (a, e, i, o, u) or not. Return true if each character in the string is a vowel, otherwise return false.">import java.util.Scanner;

public class Main {
    public static boolean onlyVowels(String str) {
        if (str.isEmpty()) {
            return false;
        }

        for (int i = 0; i < str.length(); i++) {
            char ch = Character.toLowerCase(str.charAt(i));

            if (ch != 'a' && ch != 'e' && ch != 'i'
                    && ch != 'o' && ch != 'u') {
                return false;
            }
        }

        return true;
    }

    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        String str = sc.nextLine();

        System.out.println(onlyVowels(str));
        sc.close();
    }
}</script>
