<script type="text/plain" class="program-src" data-num="5" data-title="Write a Java program to create a class called &quot;Book&quot; with attributes for title, author, and ISBN, and methods to add and remove books from a collection.">import java.util.ArrayList;

class Book {
    String title;
    String author;
    String isbn;

    Book(String title, String author, String isbn) {
        this.title = title;
        this.author = author;
        this.isbn = isbn;
    }

    public String toString() {
        return title + " by " + author + " (ISBN: " + isbn + ")";
    }
}

class BookCollection {
    ArrayList<Book> books = new ArrayList<>();

    void addBook(Book book) {
        books.add(book);
    }

    void removeBook(String isbn) {
        books.removeIf(book -> book.isbn.equals(isbn));
    }

    void displayBooks() {
        for (Book book : books) {
            System.out.println(book);
        }
    }
}

public class Main {
    public static void main(String[] args) {
        BookCollection collection = new BookCollection();

        collection.addBook(new Book("Java Basics", "Amit", "101"));
        collection.addBook(new Book("OOP Concepts", "Neha", "102"));

        collection.displayBooks();

        collection.removeBook("101");

        System.out.println("After removal:");
        collection.displayBooks();
    }
}</script>

<script type="text/plain" class="program-src" data-num="7" data-title="Write a Java program to create a class called &quot;Bank&quot; with a collection of accounts and methods to add and remove accounts, and to deposit and withdraw money. Also define a class called &quot;Account&quot; to maintain account details of a particular customer.">import java.util.ArrayList;

class Account {
    int accountNumber;
    String customerName;
    double balance;

    Account(int accountNumber, String customerName, double balance) {
        this.accountNumber = accountNumber;
        this.customerName = customerName;
        this.balance = balance;
    }

    void deposit(double amount) {
        if (amount > 0) {
            balance += amount;
        }
    }

    void withdraw(double amount) {
        if (amount > 0 && amount <= balance) {
            balance -= amount;
        }
    }

    void display() {
        System.out.println(accountNumber + " " + customerName + " " + balance);
    }
}

class Bank {
    ArrayList<Account> accounts = new ArrayList<>();

    void addAccount(Account account) {
        accounts.add(account);
    }

    void removeAccount(int accountNumber) {
        accounts.removeIf(a -> a.accountNumber == accountNumber);
    }

    Account findAccount(int accountNumber) {
        for (Account a : accounts) {
            if (a.accountNumber == accountNumber) {
                return a;
            }
        }
        return null;
    }

    void deposit(int accountNumber, double amount) {
        Account a = findAccount(accountNumber);
        if (a != null) {
            a.deposit(amount);
        }
    }

    void withdraw(int accountNumber, double amount) {
        Account a = findAccount(accountNumber);
        if (a != null) {
            a.withdraw(amount);
        }
    }

    void displayAccounts() {
        for (Account a : accounts) {
            a.display();
        }
    }
}

public class Main {
    public static void main(String[] args) {
        Bank bank = new Bank();

        bank.addAccount(new Account(101, "Rahul", 5000));
        bank.addAccount(new Account(102, "Priya", 8000));

        bank.deposit(101, 2000);
        bank.withdraw(102, 1000);

        bank.displayAccounts();

        bank.removeAccount(101);

        System.out.println("After removing account:");
        bank.displayAccounts();
    }
}</script>

<script type="text/plain" class="program-src" data-num="12" data-title="Write a Java program to create a class called &quot;Airplane&quot; with a flight number, destination, and departure time attributes, and methods to check flight status and delay.">import java.time.LocalDateTime;
import java.time.format.DateTimeFormatter;

class Airplane {
    String flightNumber;
    String destination;
    LocalDateTime departureTime;
    boolean delayed;

    Airplane(String flightNumber, String destination, LocalDateTime departureTime) {
        this.flightNumber = flightNumber;
        this.destination = destination;
        this.departureTime = departureTime;
        this.delayed = false;
    }

    void delayFlight(int minutes) {
        if (minutes > 0) {
            departureTime = departureTime.plusMinutes(minutes);
            delayed = true;
        }
    }

    void checkStatus() {
        System.out.println("Flight Number: " + flightNumber);
        System.out.println("Destination: " + destination);
        System.out.println("Departure: " + departureTime.format(
            DateTimeFormatter.ofPattern("dd-MM-yyyy HH:mm")
        ));
        System.out.println("Status: " + (delayed ? "Delayed" : "On time"));
    }
}

public class Main {
    public static void main(String[] args) {
        Airplane flight = new Airplane(
            "AI101",
            "Delhi",
            LocalDateTime.of(2026, 12, 10, 10, 30)
        );

        flight.checkStatus();

        flight.delayFlight(45);

        flight.checkStatus();
    }
}</script>
<script type="text/plain" class="program-src" data-num="13" data-title="Write a Java program to create a class called &quot;Inventory&quot; with a collection of products and methods to add and remove products, and to check for low inventory.">import java.util.ArrayList;

class Product {
    String name;
    int quantity;

    Product(String name, int quantity) {
        this.name = name;
        this.quantity = quantity;
    }
}

class Inventory {
    private ArrayList<Product> products = new ArrayList<>();

    void addProduct(Product product) {
        products.add(product);
    }

    void removeProduct(String name) {
        products.removeIf(p -> p.name.equalsIgnoreCase(name));
    }

    void checkLowInventory(int threshold) {
        for (Product p : products) {
            if (p.quantity < threshold) {
                System.out.println(p.name + " has low inventory: " + p.quantity);
            }
        }
    }

    void displayProducts() {
        for (Product p : products) {
            System.out.println(p.name + ": " + p.quantity);
        }
    }
}

public class Main {
    public static void main(String[] args) {
        Inventory inventory = new Inventory();

        inventory.addProduct(new Product("Laptop", 10));
        inventory.addProduct(new Product("Mouse", 3));
        inventory.addProduct(new Product("Keyboard", 2));

        inventory.displayProducts();

        System.out.println("Low inventory products:");
        inventory.checkLowInventory(5);

        inventory.removeProduct("Mouse");

        System.out.println("After removal:");
        inventory.displayProducts();
    }
}</script>

<script type="text/plain" class="program-src" data-num="16" data-title="Write a Java program to create a class called &quot;Shape&quot; with abstract methods for calculating area and perimeter, and subclasses for &quot;Rectangle&quot;, &quot;Circle&quot;, and &quot;Triangle&quot;.">abstract class Shape {
    abstract double calculateArea();
    abstract double calculatePerimeter();
}

class Rectangle extends Shape {
    double length;
    double width;

    Rectangle(double length, double width) {
        this.length = length;
        this.width = width;
    }

    double calculateArea() {
        return length * width;
    }

    double calculatePerimeter() {
        return 2 * (length + width);
    }
}

class Circle extends Shape {
    double radius;

    Circle(double radius) {
        this.radius = radius;
    }

    double calculateArea() {
        return Math.PI * radius * radius;
    }

    double calculatePerimeter() {
        return 2 * Math.PI * radius;
    }
}

class Triangle extends Shape {
    double a;
    double b;
    double c;

    Triangle(double a, double b, double c) {
        this.a = a;
        this.b = b;
        this.c = c;
    }

    double calculateArea() {
        double s = calculatePerimeter() / 2;
        double value = s * (s - a) * (s - b) * (s - c);
        return value >= 0 ? Math.sqrt(value) : Double.NaN;
    }

    double calculatePerimeter() {
        return a + b + c;
    }
}

public class Main {
    public static void main(String[] args) {
        Shape rectangle = new Rectangle(10, 5);
        Shape circle = new Circle(7);
        Shape triangle = new Triangle(3, 4, 5);

        System.out.println("Rectangle Area: " + rectangle.calculateArea());
        System.out.println("Rectangle Perimeter: " + rectangle.calculatePerimeter());

        System.out.println("Circle Area: " + circle.calculateArea());
        System.out.println("Circle Perimeter: " + circle.calculatePerimeter());

        System.out.println("Triangle Area: " + triangle.calculateArea());
        System.out.println("Triangle Perimeter: " + triangle.calculatePerimeter());
    }
}</script>

<script type="text/plain" class="program-src" data-num="18" data-title="Write a Java program to create a class called &quot;Restaurant&quot; with attributes for menu items, prices, and ratings, and methods to add and remove items, and to calculate average rating.">import java.util.ArrayList;
import java.util.LinkedHashMap;

class Restaurant {
    private LinkedHashMap<String, Double> menu = new LinkedHashMap<>();
    private ArrayList<Double> ratings = new ArrayList<>();

    void addItem(String item, double price) {
        if (price >= 0) {
            menu.put(item, price);
        }
    }

    void removeItem(String item) {
        menu.remove(item);
    }

    void addRating(double rating) {
        if (rating >= 1 && rating <= 5) {
            ratings.add(rating);
        }
    }

    double averageRating() {
        if (ratings.isEmpty()) {
            return 0;
        }

        double total = 0;

        for (double rating : ratings) {
            total += rating;
        }

        return total / ratings.size();
    }

    void displayMenu() {
        for (String item : menu.keySet()) {
            System.out.println(item + ": " + menu.get(item));
        }
    }
}

public class Main {
    public static void main(String[] args) {
        Restaurant restaurant = new Restaurant();

        restaurant.addItem("Pizza", 250);
        restaurant.addItem("Burger", 120);
        restaurant.addItem("Pasta", 180);

        restaurant.addRating(4.5);
        restaurant.addRating(5.0);
        restaurant.addRating(4.0);

        restaurant.displayMenu();

        restaurant.removeItem("Burger");

        System.out.println("Updated menu:");
        restaurant.displayMenu();

        System.out.println("Average Rating: " + restaurant.averageRating());
    }
}</script>
<script type="text/plain" class="program-src" data-num="19" data-title="Write a Java program to create a class with methods to search for flights and hotels, and to book and cancel reservations.">import java.util.ArrayList;

class ReservationSystem {
    private ArrayList<String> flights = new ArrayList<>();
    private ArrayList<String> hotels = new ArrayList<>();
    private ArrayList<String> reservations = new ArrayList<>();

    ReservationSystem() {
        flights.add("AI101 Delhi to Mumbai");
        flights.add("AI202 Chandigarh to Delhi");
        hotels.add("Grand Hotel Delhi");
        hotels.add("City Hotel Mumbai");
    }

    void searchFlights(String keyword) {
        for (String flight : flights) {
            if (flight.toLowerCase().contains(keyword.toLowerCase())) {
                System.out.println(flight);
            }
        }
    }

    void searchHotels(String keyword) {
        for (String hotel : hotels) {
            if (hotel.toLowerCase().contains(keyword.toLowerCase())) {
                System.out.println(hotel);
            }
        }
    }

    void bookReservation(String reservation) {
        reservations.add(reservation);
        System.out.println("Reservation booked: " + reservation);
    }

    void cancelReservation(String reservation) {
        if (reservations.remove(reservation)) {
            System.out.println("Reservation cancelled: " + reservation);
        } else {
            System.out.println("Reservation not found.");
        }
    }

    void displayReservations() {
        System.out.println("Reservations: " + reservations);
    }
}

public class Main {
    public static void main(String[] args) {
        ReservationSystem system = new ReservationSystem();

        System.out.println("Flights:");
        system.searchFlights("Delhi");

        System.out.println("Hotels:");
        system.searchHotels("Delhi");

        system.bookReservation("AI101 Delhi to Mumbai");
        system.bookReservation("Grand Hotel Delhi");

        system.displayReservations();

        system.cancelReservation("AI101 Delhi to Mumbai");

        system.displayReservations();
    }
}</script>

<script type="text/plain" class="program-src" data-num="23" data-title="Create a class entering the rollno, name and class of the student from user but rollno should be automatically generated as we enter the information of 10 students">import java.util.Scanner;

class Student {
    private static int nextRollNo = 1;
    int rollNo;
    String name;
    String studentClass;

    Student(String name, String studentClass) {
        this.rollNo = nextRollNo++;
        this.name = name;
        this.studentClass = studentClass;
    }

    void display() {
        System.out.println("Roll Number: " + rollNo);
        System.out.println("Name: " + name);
        System.out.println("Class: " + studentClass);
    }
}

public class Main {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);
        Student[] students = new Student[10];

        for (int i = 0; i < students.length; i++) {
            System.out.println("Enter name of student " + (i + 1) + ":");
            String name = sc.nextLine();

            System.out.println("Enter class of student " + (i + 1) + ":");
            String studentClass = sc.nextLine();

            students[i] = new Student(name, studentClass);
        }

        for (Student student : students) {
            student.display();
        }

        sc.close();
    }
}</script>

<script type="text/plain" class="program-src" data-num="30" data-title="Write a Java program to create a class called Circle with a private instance variable radius. Provide public getter and setter methods to access and modify the radius variable. However, provide two methods called calculateArea() and calculatePerimeter() that return the calculated area and perimeter based on the current radius value.">class Circle {
    private double radius;

    public double getRadius() {
        return radius;
    }

    public void setRadius(double radius) {
        if (radius >= 0) {
            this.radius = radius;
        }
    }

    public double calculateArea() {
        return Math.PI * radius * radius;
    }

    public double calculatePerimeter() {
        return 2 * Math.PI * radius;
    }
}

public class Main {
    public static void main(String[] args) {
        Circle circle = new Circle();

        circle.setRadius(5);

        System.out.println("Radius: " + circle.getRadius());
        System.out.println("Area: " + circle.calculateArea());
        System.out.println("Perimeter: " + circle.calculatePerimeter());
    }
}</script>

<script type="text/plain" class="program-src" data-num="32" data-title="Write a Java program to create a class called Student with private instance variables student_id, student_name, and grades. Provide public getter and setter methods to access and modify the student_id and student_name variables. However, provide a method called addGrade() that allows adding a grade to the grades variable while performing additional validation.">import java.util.ArrayList;

class Student {
    private int student_id;
    private String student_name;
    private ArrayList<Double> grades = new ArrayList<>();

    public int getStudentId() {
        return student_id;
    }

    public void setStudentId(int student_id) {
        if (student_id > 0) {
            this.student_id = student_id;
        }
    }

    public String getStudentName() {
        return student_name;
    }

    public void setStudentName(String student_name) {
        if (student_name != null && !student_name.trim().isEmpty()) {
            this.student_name = student_name;
        }
    }

    public void addGrade(double grade) {
        if (grade >= 0 && grade <= 100) {
            grades.add(grade);
        } else {
            System.out.println("Invalid grade. Enter a value from 0 to 100.");
        }
    }

    public ArrayList<Double> getGrades() {
        return new ArrayList<>(grades);
    }
}

public class Main {
    public static void main(String[] args) {
        Student student = new Student();

        student.setStudentId(101);
        student.setStudentName("Priya Sharma");

        student.addGrade(85);
        student.addGrade(92);
        student.addGrade(78);
        student.addGrade(120);

        System.out.println("Student ID: " + student.getStudentId());
        System.out.println("Student Name: " + student.getStudentName());
        System.out.println("Grades: " + student.getGrades());
    }
}</script>
