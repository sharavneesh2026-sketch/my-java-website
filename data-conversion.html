<script type="text/plain" class="program-src" data-num="16" data-title="How to convert long to int">import java.util.Scanner;

public class Main {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);
        long number = sc.nextLong();

        if (number >= Integer.MIN_VALUE && number <= Integer.MAX_VALUE) {
            int result = (int) number;
            System.out.println(result);
        } else {
            System.out.println("Value is outside the int range.");
        }

        sc.close();
    }
}</script>

<script type="text/plain" class="program-src" data-num="23" data-title="How to convert Date to Timestamp">import java.sql.Timestamp;
import java.time.LocalDateTime;
import java.time.ZoneId;
import java.util.Date;
import java.util.Scanner;

public class Main {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);
        String input = sc.nextLine();

        LocalDateTime dateTime = LocalDateTime.parse(input);
        Date date = Date.from(
            dateTime.atZone(ZoneId.systemDefault()).toInstant()
        );

        Timestamp timestamp = new Timestamp(date.getTime());

        System.out.println(timestamp);
        sc.close();
    }
}</script>

}</script>
<script type="text/plain" class="program-src" data-num="25" data-title="How to convert Binary to Decimal">import java.util.Scanner;

public class Main {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);
        String binary = sc.nextLine();

        try {
            int decimal = Integer.parseInt(binary, 2);
            System.out.println(decimal);
        } catch (NumberFormatException e) {
            System.out.println("Invalid binary number.");
        }

        sc.close();
    }
}</script>
