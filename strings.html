<script type="text/plain" class="program-src" data-num="19" data-title="Program to Divide a String into N Equal Parts">import java.util.Scanner;

class Main {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);
        String s = sc.nextLine();
        int n = sc.nextInt();

        if (n <= 0 || s.length() % n != 0) {
            System.out.println("String cannot be divided into equal parts");
            return;
        }

        int size = s.length() / n;
        for (int i = 0; i < s.length(); i += size) {
            System.out.println(s.substring(i, i + size));
        }
    }
}</script>
<script type="text/plain" class="program-src" data-num="20" data-title="Program to Find All Subsets of a String">import java.util.Scanner;

class Main {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);
        String s = sc.nextLine();
        int n = s.length();

        for (int i = 1; i < (1 << n); i++) {
            StringBuilder subset = new StringBuilder();
            for (int j = 0; j < n; j++) {
                if ((i & (1 << j)) != 0) {
                    subset.append(s.charAt(j));
                }
            }
            System.out.println(subset);
        }
    }
}</script>
<script type="text/plain" class="program-src" data-num="21" data-title="Program to Find All the Permutations of a String">import java.util.Scanner;

class Main {
    static void permute(String s, String result) {
        if (s.isEmpty()) {
            System.out.println(result);
            return;
        }

        for (int i = 0; i < s.length(); i++) {
            permute(s.substring(0, i) + s.substring(i + 1),
                    result + s.charAt(i));
        }
    }

    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);
        String s = sc.nextLine();
        permute(s, "");
    }
}</script>
<script type="text/plain" class="program-src" data-num="22" data-title="Program to Find Maximum and Minimum Occurring Character in a String">import java.util.Scanner;

class Main {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);
        String s = sc.nextLine();
        int[] freq = new int[65536];

        for (char ch : s.toCharArray()) {
            if (!Character.isWhitespace(ch)) {
                freq[ch]++;
            }
        }

        char maxChar = 0, minChar = 0;
        int max = 0, min = Integer.MAX_VALUE;

        for (int i = 0; i < freq.length; i++) {
            if (freq[i] > 0) {
                if (freq[i] > max) {
                    max = freq[i];
                    maxChar = (char) i;
                }
                if (freq[i] < min) {
                    min = freq[i];
                    minChar = (char) i;
                }
            }
        }

        if (max == 0) {
            System.out.println("No characters found");
        } else {
            System.out.println("Maximum occurring character: " + maxChar + " (" + max + ")");
            System.out.println("Minimum occurring character: " + minChar + " (" + min + ")");
        }
    }
}</script>

<script type="text/plain" class="program-src" data-num="27" data-title="Program to Find the Largest and Smallest Word in a String">import java.util.Scanner;

            return;

        String[] words = s.split("\\s+");

<script type="text/plain" class="program-src" data-num="28" data-title="Program to Find the Longest Repeating Sequence in a String">import java.util.Scanner;

class Main {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);
        String s = sc.nextLine();
        String longest = "";

        for (int len = s.length() - 1; len > 0; len--) {
            boolean found = false;
            for (int i = 0; i + len <= s.length(); i++) {
                String sub = s.substring(i, i + len);
                if (s.indexOf(sub, i + 1) != -1) {
                    longest = sub;
                    found = true;
                    break;
                }
            }
            if (found) {
                break;
            }
        }

        System.out.println(longest.isEmpty() ? "No repeating sequence" : longest);
    }
}</script>
<script type="text/plain" class="program-src" data-num="29" data-title="Program to Find the Most Repeated Word in a Text File">import java.io.File;
import java.io.FileNotFoundException;
import java.util.LinkedHashMap;
import java.util.Map;
import java.util.Scanner;

class Main {
    public static void main(String[] args) throws FileNotFoundException {
        Scanner sc = new Scanner(System.in);
        String filename = sc.nextLine();
        Map<String, Integer> map = new LinkedHashMap<>();

        try (Scanner file = new Scanner(new File(filename))) {
            while (file.hasNext()) {
                String word = file.next().toLowerCase().replaceAll("^[^a-z0-9]+|[^a-z0-9]+$", "");
                if (!word.isEmpty()) {
                    map.put(word, map.getOrDefault(word, 0) + 1);
                }
            }
        }

        String mostRepeated = "";
        int max = 0;

        for (Map.Entry<String, Integer> entry : map.entrySet()) {
            if (entry.getValue() > max) {
                max = entry.getValue();
                mostRepeated = entry.getKey();
            }
        }

        if (max == 0) {
            System.out.println("No words found");
        } else {
            System.out.println("Most repeated word: " + mostRepeated);
            System.out.println("Frequency: " + max);
        }
    }
}</script>

<script type="text/plain" class="program-src" data-num="36" data-title="Program to Print Smallest and Biggest Possible Palindrome Word in a Given String">import java.util.Scanner;

class Main {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);
        String s = sc.nextLine().trim();

        if (s.isEmpty()) {
            System.out.println("No words found");
            return;
        }

        String smallest = "", biggest = "";
        String[] words = s.split("\\s+");

        for (String word : words) {
            String clean = word.replaceAll("[^a-zA-Z0-9]", "");
            String rev = new StringBuilder(clean).reverse().toString();

            if (!clean.isEmpty() && clean.equalsIgnoreCase(rev)) {
                if (smallest.isEmpty() || clean.length() < smallest.length()) {
                    smallest = clean;
                }
                if (clean.length() > biggest.length()) {
                    biggest = clean;
                }
            }
        }

        if (smallest.isEmpty()) {
            System.out.println("No palindrome words found");
        } else {
            System.out.println("Smallest palindrome: " + smallest);
            System.out.println("Biggest palindrome: " + biggest);
        }
    }
}</script>

<script type="text/plain" class="program-src" data-num="43" data-title="Program for Swapping Pairs of Characters">import java.util.Scanner;

class Main {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);
        String s = sc.nextLine();
        char[] arr = s.toCharArray();

        for (int i = 0; i + 1 < arr.length; i += 2) {
            char temp = arr[i];
            arr[i] = arr[i + 1];
            arr[i + 1] = temp;
        }

        System.out.println(new String(arr));
    }
}</script>

<script type="text/plain" class="program-src" data-num="46" data-title="Reverse String Word by Word">import java.util.Scanner;

        Scanner sc = new Scanner(System.in);
        String s = sc.nextLine().trim();

        if (!s.isEmpty()) {
            String[] words = s.split("\\s+");

            for (int i = words.length - 1; i >= 0; i--) {

            }
        }

    }
}</script>

<script type="text/plain" class="program-src" data-num="48" data-title="Write a Program to Find the First Non-Repeated Character from Input String">import java.util.LinkedHashMap;
import java.util.Map;
import java.util.Scanner;

class Main {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);
        String s = sc.nextLine();
        Map<Character, Integer> map = new LinkedHashMap<>();

        for (char ch : s.toCharArray()) {
            map.put(ch, map.getOrDefault(ch, 0) + 1);
        }

        boolean found = false;

        for (Map.Entry<Character, Integer> entry : map.entrySet()) {
            if (entry.getValue() == 1) {
                System.out.println("First non-repeated character: " + entry.getKey());
                found = true;
                break;
            }
        }

        if (!found) {
            System.out.println("No non-repeated character found");
        }
    }
}</script>
