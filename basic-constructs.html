<script type="text/plain" class="program-src" data-num="4" data-title="Write a Java program to print the sum, multiply, subtract, divide and remainder of two numbers">import java.util.Scanner;

<script type="text/plain" class="program-src" data-num="12" data-title="Write a Java program to count the letters, spaces, numbers and other characters of an input string">import java.util.Scanner;

public class Main {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        String str = sc.nextLine();
        int letters = 0;
        int spaces = 0;
        int numbers = 0;
        int others = 0;

        for (int i = 0; i < str.length(); i++) {
            char ch = str.charAt(i);

            if (Character.isLetter(ch)) {
                letters++;
            } else if (ch == ' ') {
                spaces++;
            } else if (Character.isDigit(ch)) {
                numbers++;
            } else {
                others++;
            }
        }

        System.out.println("Letters: " + letters);
        System.out.println("Spaces: " + spaces);
        System.out.println("Numbers: " + numbers);
        System.out.println("Other characters: " + others);

        sc.close();
    }
}</script>

<script type="text/plain" class="program-src" data-num="14" data-title="Write a Java program that accepts an integer (n) and computes the value of n+nn+nnn">import java.util.Scanner;

public class Main {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        long n = sc.nextLong();

        if (n < 0) {
            System.out.println("Enter a non-negative integer.");
        } else {
            try {
                long nn = Math.addExact(Math.multiplyExact(n, 10), n);
                long nnn = Math.addExact(Math.multiplyExact(nn, 10), n);
                long sum = Math.addExact(Math.addExact(n, nn), nnn);

                System.out.println(sum);
            } catch (ArithmeticException e) {
                System.out.println("Number is too large.");
            }
        }

        sc.close();
    }
}</script>

<script type="text/plain" class="program-src" data-num="20" data-title="Write a Java program to compute the sum of the first 100 prime numbers">public class Main {
    public static boolean isPrime(int n) {
        if (n < 2) {
            return false;
        }

        for (int i = 2; i <= n / i; i++) {
            if (n % i == 0) {
                return false;
            }
        }

        return true;
    }

    public static void main(String[] args) {
        int count = 0;
        int number = 2;
        long sum = 0;

        while (count < 100) {
            if (isPrime(number)) {
                sum += number;
                count++;
            }
            number++;
        }

        System.out.println(sum);
    }
}</script>
<script type="text/plain" class="program-src" data-num="21" data-title="Write a Java program to swap the first and last elements of an array and create a new array">import java.util.Scanner;
import java.util.Arrays;

public class Main {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        int n = sc.nextInt();
        int[] original = new int[n];

        for (int i = 0; i < n; i++) {
            original[i] = sc.nextInt();
        }

        int[] result = Arrays.copyOf(original, n);

        if (n > 1) {
            int temp = result[0];
            result[0] = result[n - 1];
            result[n - 1] = temp;
        }

        System.out.println(Arrays.toString(result));
        sc.close();
    }
}</script>

<script type="text/plain" class="program-src" data-num="24" data-title="Write a Java program to check if a positive number is a palindrome or not">import java.util.Scanner;

public class Main {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        long number = sc.nextLong();

        if (number < 0) {
            System.out.println("Not a palindrome");
        } else {
            long original = number;
            long reversed = 0;

            while (number > 0) {
                reversed = reversed * 10 + number % 10;
                number /= 10;
            }

            if (original == reversed) {
                System.out.println("Palindrome");
            } else {
                System.out.println("Not a palindrome");
            }
        }

        sc.close();
    }
}</script>
<script type="text/plain" class="program-src" data-num="25" data-title="Write a Java program to add two numbers without using any arithmetic operators">import java.util.Scanner;

public class Main {
    public static int add(int a, int b) {
        while (b != 0) {
            int carry = (a & b) << 1;
            a = a ^ b;
            b = carry;
        }

        return a;
    }

    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        int a = sc.nextInt();
        int b = sc.nextInt();

        System.out.println(add(a, b));
        sc.close();
    }
}</script>

<script type="text/plain" class="program-src" data-num="42" data-title="Java program to check vowel or consonant">import java.util.Scanner;

public class Main {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        char ch = Character.toLowerCase(sc.next().charAt(0));

        if (ch < 'a' || ch > 'z') {
            System.out.println("Not an alphabet.");
        } else if ("aeiou".indexOf(ch) >= 0) {

<script type="text/plain" class="program-src" data-num="45" data-title="Java Program to calculate electricity bill">import java.util.Scanner;

        double bill;

        if (units < 0) {
            System.out.println("Invalid units.");
        } else {
            if (units <= 100) {
                bill = units * 1.5;
            } else if (units <= 200) {
                bill = 100 * 1.5 + (units - 100) * 2.5;
            } else if (units <= 300) {
                bill = 100 * 1.5 + 100 * 2.5 + (units - 200) * 4;
            } else {
                bill = 100 * 1.5 + 100 * 2.5 + 100 * 4 + (units - 300) * 6;
            }

        }

}</script>

<script type="text/plain" class="program-src" data-num="47" data-title="Java Program to calculate compound interest">import java.util.Scanner;

public class Main {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        double principal = sc.nextDouble();
        double rate = sc.nextDouble();
        int years = sc.nextInt();

        if (principal < 0 || rate < 0 || years < 0) {
            System.out.println("Invalid input.");
        } else {
            double amount = principal * Math.pow(1 + rate / 100, years);
            double interest = amount - principal;

            System.out.println("Compound interest: " + interest);
            System.out.println("Total amount: " + amount);
        }

        sc.close();
    }
}</script>

<script type="text/plain" class="program-src" data-num="89" data-title="Write a Java program to find the common elements between two arrays">import java.util.Scanner;

public class Main {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        int n = sc.nextInt();
        int[] a = new int[n];

        Set<Integer> common = new LinkedHashSet<>();

        for (int value : b) {

<script type="text/plain" class="program-src" data-num="129" data-title="Write a Java method to check numbers is palindrome number or not">import java.util.Scanner;

public class Main {
    public static boolean isPalindrome(long number) {
        if (number < 0) {
            return false;
        }

        long original = number;
        long reversed = 0;

        while (number > 0) {
            reversed = reversed * 10 + number % 10;
            number /= 10;
        }

        return original == reversed;
    }

    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        long number = sc.nextLong();

        System.out.println(isPalindrome(number));
        sc.close();
    }
}</script>
<script type="text/plain" class="program-src" data-num="130" data-title="Write a Java method to displays prime numbers between 1 to 20">public class Main {
    public static boolean isPrime(int number) {
        if (number < 2) {
            return false;
        }

        for (int i = 2; i <= number / i; i++) {
            if (number % i == 0) {
                return false;
            }
        }

        return true;
    }

    public static void displayPrimes() {
        for (int i = 1; i <= 20; i++) {
            if (isPrime(i)) {
                System.out.print(i + " ");
            }
        }

        System.out.println();
    }

    public static void main(String[] args) {
        displayPrimes();
    }
}</script>
<script type="text/plain" class="program-src" data-num="131" data-title="Write a Java method to find GCD and LCM of Two Numbers">import java.util.Scanner;

public class Main {
    public static long gcd(long a, long b) {
        a = Math.abs(a);
        b = Math.abs(b);

        while (b != 0) {
            long temp = b;
            b = a % b;
            a = temp;
        }

        return a;
    }

    public static long lcm(long a, long b) {
        if (a == 0 || b == 0) {
            return 0;
        }

        return Math.abs((a / gcd(a, b)) * b);
    }

    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        long a = sc.nextLong();
        long b = sc.nextLong();

        System.out.println("GCD: " + gcd(a, b));
        System.out.println("LCM: " + lcm(a, b));

        sc.close();
    }
}</script>
<script type="text/plain" class="program-src" data-num="132" data-title="Write a Java method to find factorial using recursion in java">import java.util.Scanner;
import java.math.BigInteger;

public class Main {
    public static BigInteger factorial(int n) {
        if (n <= 1) {
            return BigInteger.ONE;
        }

        return BigInteger.valueOf(n).multiply(factorial(n - 1));
    }

    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        int n = sc.nextInt();

        if (n < 0) {
            System.out.println("Factorial is not defined for negative numbers.");
        } else if (n > 5000) {
            System.out.println("Number is too large for this recursive program.");
        } else {
            System.out.println(factorial(n));
        }

        sc.close();
    }
}</script>
<script type="text/plain" class="program-src" data-num="133" data-title="Write a Java program to reverse an integer number">import java.util.Scanner;

public class Main {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        long number = sc.nextLong();
        long reversed = 0;

        try {
            while (number != 0) {
                long digit = number % 10;
                reversed = Math.addExact(
                    Math.multiplyExact(reversed, 10), digit
                );
                number /= 10;
            }

            System.out.println(reversed);
        } catch (ArithmeticException e) {
            System.out.println("Reversed number is too large.");
        }

        sc.close();
    }
}</script>

<script type="text/plain" class="program-src" data-num="137" data-title="Write a Java program to convert Roman number to an integer number">import java.util.Scanner;

public class Main {
    public static int romanValue(char ch) {
        switch (ch) {
            case 'I': return 1;
            case 'V': return 5;
            case 'X': return 10;
            case 'L': return 50;
            case 'C': return 100;
            case 'D': return 500;
            case 'M': return 1000;
            default: return 0;
        }
    }

    public static int romanToInteger(String roman) {
        roman = roman.toUpperCase();
        int total = 0;

        for (int i = 0; i < roman.length(); i++) {
            int current = romanValue(roman.charAt(i));

            if (current == 0) {
                return -1;
            }

            if (i + 1 < roman.length()
                    && current < romanValue(roman.charAt(i + 1))) {
                total -= current;
            } else {
                total += current;
            }
        }

        return total;
    }

    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        String roman = sc.nextLine().trim();

        if (roman.isEmpty()) {
            System.out.println("Invalid Roman numeral.");
        } else {
            int result = romanToInteger(roman);

            if (result == -1) {
                System.out.println("Invalid Roman numeral.");
            } else {
                System.out.println(result);
            }
        }

        sc.close();
    }
}</script>
