<script type="text/plain" class="program-src" data-num="1" data-title="Enter the character from user using InputStreamReader">import java.io.InputStreamReader;
import java.io.BufferedReader;
import java.io.IOException;

public class Main {
    public static void main(String[] args) throws IOException {
        InputStreamReader isr = new InputStreamReader(System.in);
        BufferedReader br = new BufferedReader(isr);
        System.out.print("Enter a character: ");
        char ch = (char) br.read();
        System.out.println("Entered character: " + ch);
    }
}</script>

<script type="text/plain" class="program-src" data-num="9" data-title="Get all characters from the file and display on the screen" data-note="Note: Create a file named `input.txt` in the same folder as `Main.java` and add some text to it before running the program.">import java.io.FileReader;
import java.io.IOException;

public class Main {
    public static void main(String[] args) {
        try (FileReader fr = new FileReader("input.txt")) {
            int ch;
            while ((ch = fr.read()) != -1) {
                System.out.print((char) ch);
            }
        } catch (IOException e) {
            System.out.println("Error reading file: " + e.getMessage());
        }
    }
}</script>
<script type="text/plain" class="program-src" data-num="10" data-title="Get all characters from the file, count number of lines, words, characters and display on the screen">import java.io.BufferedReader;
import java.io.FileReader;
import java.io.IOException;

public class Main {
    public static void main(String[] args) {
        int lines = 0;
        int words = 0;
        int characters = 0;

        try (BufferedReader br = new BufferedReader(new FileReader("input.txt"))) {
            String line;

            while ((line = br.readLine()) != null) {
                lines++;
                characters += line.length();

                String trimmed = line.trim();
                if (!trimmed.isEmpty()) {
                    words += trimmed.split("\\s+").length;
                }

                System.out.println(line);
            }

            System.out.println("Number of lines: " + lines);
            System.out.println("Number of words: " + words);
            System.out.println("Number of characters: " + characters);
        } catch (IOException e) {
            System.out.println("Error reading file: " + e.getMessage());
        }
    }
}</script>
